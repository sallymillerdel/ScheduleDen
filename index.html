<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ScheduleDen</title>

<!-- Favicon specifically for the browser tab (PC) -->
<link rel="icon" type="image/png" sizes="32x32" href="download.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="download.png?v=4">
<link rel="shortcut icon" href="download.png?v=4">

<!-- Manifest for PWA (Android App) -->
<link id="pwa-manifest" rel="manifest">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- SheetJS for Excel -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
  :root {
    --bg:         #12141c; 
    --surface:    #222433; 
    --surface2:   #2a2d3e; 
    --border:     #2a2d3e;
    --text:       #ffffff;
    --muted:      #8b8e9b;
    --accent:     #2b5ff3; 
    --danger:     #ef4444;

    /* User Requested Colors */
    --lec:        #34d399; /* Green */
    --sem:        #f59e0b; /* Orange */
    --phys:       #6c8ff8; /* Blue */
    
    --radius:     16px;
    --radius-sm:  10px;
  }
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }

  .app-layout {
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }

  /* Desktop Header (Hidden on Mobile) */
  .desktop-header {
    display: none; justify-content: space-between; align-items: center;
    padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .brand-text { font-size: 18px; font-weight: 600; }
  .header-actions { display: flex; gap: 12px; }
  
  .btn {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
    cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #1e4bd8; border-color: #1e4bd8; }

  /* Main Wrapper */
  .main-wrapper {
    flex: 1; display: flex; flex-direction: column;
    overflow-y: auto; padding-bottom: 90px; /* Space for mobile nav */
  }

  .calendar-sidebar { padding: 20px 24px; flex-shrink: 0; }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .cal-month { font-size: 20px; font-weight: 600; }
  .cal-nav { display: flex; gap: 8px; align-items: center; }
  .cal-btn {
    width: 32px; height: 32px; background: transparent; border: none; color: var(--muted);
    border-radius: 8px; cursor: pointer; display: grid; place-items: center; transition: 0.2s;
  }
  .cal-btn:hover { background: var(--surface); color: var(--text); }
  .cal-btn-today {
    height: 32px; padding: 0 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    border: 1px solid var(--border); border-radius: 8px; color: var(--text); background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; outline: none;
  }
  .cal-btn-today:hover { background: var(--surface2); }

  .cal-dow {
    display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
    font-size: 11px; font-weight: 600; color: #6c8ff8; margin-bottom: 8px;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 48px; border-radius: 12px; cursor: pointer; transition: 0.2s; position: relative;
  }
  .cal-cell:hover { background: var(--surface); }
  .cal-cell.other-month { opacity: 0.3; pointer-events: none; }
  .cal-cell.today .cal-num { color: #b5c7f8; font-weight: 700; }
  .cal-cell.selected { background: #b5c7f8; }
  .cal-cell.selected .cal-num { color: #12141c; font-weight: 700; }
  .cal-num { font-size: 15px; font-weight: 500; }
  
  .cal-dots { display: flex; gap: 3px; position: absolute; bottom: 6px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; }
  .dot-lec { background: var(--lec); }
  .dot-sem { background: var(--sem); }
  .dot-phys { background: var(--phys); }
  .cal-cell.selected .cal-dot { opacity: 0.8; }

  /* Desktop Legend */
  .desktop-legend { display: none; margin-top: 30px; flex-direction: column; gap: 12px; padding: 16px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .legend-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; }
  .legend-color { width: 12px; height: 12px; border-radius: 4px; }

  .classes-main { padding: 0 24px; flex: 1; display: flex; flex-direction: column; }
  .classes-header { font-size: 15px; font-weight: 500; color: var(--muted); margin-bottom: 12px; padding-left: 4px; }
  
  .class-card {
    background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    display: flex; align-items: stretch; border: 1px solid transparent; transition: border-color 0.2s;
  }
  .class-card:hover { border-color: var(--border); }
  
  .class-time {
    width: 60px; display: flex; flex-direction: column; justify-content: center; flex-shrink: 0;
  }
  .time-start { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; color: var(--text); }
  .time-end { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 4px; }
  
  .class-stripe { width: 3px; border-radius: 3px; margin: 4px 16px 4px 0; }
  .stripe-lec { background: var(--lec); } .stripe-sem { background: var(--sem); } .stripe-phys { background: var(--phys); }
  
  .class-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .class-title {
    font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px;
  }
  .class-meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .class-options {
    width: 32px; display: flex; align-items: center; justify-content: flex-end; cursor: pointer; color: var(--muted);
  }
  .class-options:hover { color: var(--text); }

  .empty-state { padding: 40px 20px; text-align: center; color: var(--muted); margin: auto; }
  .empty-icon { font-size: 48px; opacity: 0.5; margin-bottom: 16px; }
  .empty-title { font-size: 16px; font-weight: 500; color: var(--text); margin-bottom: 8px; }

  .mobile-bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: rgba(18, 20, 28, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-around; z-index: 10;
  }
  .nav-btn {
    background: transparent; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.2s;
  }
  .nav-btn:hover, .nav-btn.active { color: var(--text); }
  .nav-btn svg { width: 24px; height: 24px; }
  
  /* Floating Action Button (FAB) */
  .fab-container { position: relative; top: -25px; }
  .fab {
    width: 60px; height: 60px; border-radius: 20px; background: var(--accent); color: white; border: none;
    box-shadow: 0 10px 20px rgba(43, 95, 243, 0.4); display: grid; place-items: center; cursor: pointer; transition: transform 0.2s;
  }
  .fab:active { transform: scale(0.95); }
  .fab svg { width: 28px; height: 28px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }
  
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    width: 90%; max-width: 360px; display: flex; flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: translateY(20px); transition: transform 0.2s ease;
  }
  .overlay.active .modal { transform: translateY(0); }
  .modal-body { padding: 24px; font-size: 15px; line-height: 1.5; color: var(--text); text-align: center; }
  .modal-actions { display: flex; border-top: 1px solid var(--border); }
  .modal-btn {
    flex: 1; padding: 16px; background: transparent; border: none; font-size: 15px; font-weight: 500;
    color: var(--muted); cursor: pointer; transition: 0.2s;
  }
  .modal-btn:hover { background: var(--surface2); color: var(--text); }
  .modal-btn.primary { color: var(--accent); font-weight: 600; border-left: 1px solid var(--border); }
  .modal-btn.danger { color: var(--danger); font-weight: 600; border-left: 1px solid var(--border); }

  /* Settings Modal Content */
  .settings-modal { padding: 24px; text-align: left; }
  .settings-modal h3 { font-size: 18px; margin-bottom: 8px; }
  .settings-modal p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .api-input {
    width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-family: 'JetBrains Mono', monospace; margin-bottom: 24px; outline: none;
  }
  .api-input:focus { border-color: var(--accent); }
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 10px; font-size: 13px; cursor: pointer; text-align: center; }
  .btn-outline:hover { background: var(--surface2); }
  
  .loader-content { display: flex; flex-direction: column; align-items: center; gap: 20px; color: var(--text); }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--surface); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translate(-50%, -100px);
    background: var(--surface2); color: var(--text); padding: 12px 24px; border-radius: 30px;
    font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border);
    opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9999;
  }

  @media (min-width: 800px) {
    .app-layout { background: var(--bg); }
    
    .desktop-header { display: flex; }
    .mobile-bottom-nav { display: none; }
    
    .main-wrapper {
      flex-direction: row; padding-bottom: 0;
    }
    
    .calendar-sidebar {
      width: 360px; border-right: 1px solid var(--border); padding: 24px 32px;
    }
    
    .classes-main {
      flex: 1; padding: 32px 40px; max-width: 1000px;
    }
    .classes-header { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 20px; }
    
    .desktop-legend { display: flex; }
  }
  
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div class="app-layout">
  
  <!-- Desktop Header -->
  <header class="desktop-header">
    <div class="brand">
      <img src="download_2.png" alt="Logo">
      <div class="brand-text">ScheduleDen</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="triggerImport()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import Screenshot
      </button>
      <button class="btn" onclick="openSettings()">⚙️ Settings</button>
    </div>
  </header>

  <!-- Main Content -->
  <div class="main-wrapper">
    
    <!-- Sidebar / Calendar -->
    <aside class="calendar-sidebar">
      <div class="cal-header">
        <div class="cal-month" id="calMonthLabel">September 2026</div>
        <div class="cal-nav">
          <button class="cal-btn-today" onclick="goToToday()">Today</button>
          <button class="cal-btn" onclick="changeMonth(-1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
          <button class="cal-btn" onclick="changeMonth(1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
        </div>
      </div>
      
      <div class="cal-dow">
        <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
      </div>
      <div class="cal-grid" id="calGrid">
        <!-- Calendar JS -->
      </div>
      
      <!-- Desktop Legend -->
      <div class="desktop-legend">
        <div class="legend-title">Legend</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--lec)"></div> Lecture</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--sem)"></div> Seminar</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--phys)"></div> Physical Education</div>
      </div>
    </aside>

    <!-- Main Classes View -->
    <main class="classes-main">
      <div class="classes-header" id="classesDateLabel">Classes</div>
      <div id="classesList">
        <!-- Classes JS -->
      </div>
    </main>

  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <button class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span style="font-size: 10px; font-weight: 500;">Schedule</span>
    </button>
    
    <div class="fab-container">
      <button class="fab" onclick="triggerImport()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>

    <button class="nav-btn" onclick="openSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">Settings</span>
    </button>
  </nav>

</div>

<!-- Hidden Inputs -->
<input type="file" id="uploadInput" accept="image/*" multiple style="display: none;" onchange="handleFileUpload(event)">
<input type="file" id="excelInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelImport(event)">

<!-- Modals -->
<div class="overlay" id="settingsModal">
  <div class="modal settings-modal">
    <h3>⚙️ App Settings</h3>
    <p>Configure API and manage your data.</p>
    <input type="password" id="apiKeyInput" class="api-input" placeholder="Gemini API Key (AIzaSy...)">
    <div class="action-grid">
      <button class="btn-outline" onclick="exportToExcel()">↓ Export Excel</button>
      <button class="btn-outline" onclick="document.getElementById('excelInput').click()">↑ Import Excel</button>
    </div>
    <div class="modal-actions" style="border: none;">
      <button class="modal-btn" style="border: none;" onclick="closeSettings()">Cancel</button>
      <button class="modal-btn primary" style="border: none;" onclick="saveApiKey()">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-body" id="confirmMessage">Are you sure?</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeConfirm()">Cancel</button>
      <button class="modal-btn danger" onclick="executeConfirm()">Delete</button>
    </div>
  </div>
</div>

<div class="overlay" id="alertModal">
  <div class="modal">
    <div class="modal-body" id="customAlertContainer">Message</div>
    <div class="modal-actions">
      <button class="modal-btn primary" style="border: none;" onclick="document.getElementById('alertModal').classList.remove('active')">OK</button>
    </div>
  </div>
</div>

<div class="overlay" id="loadingOverlay">
  <div class="loader-content">
    <div class="spinner"></div>
    <div style="font-weight: 500;">Analyzing screenshot...</div>
  </div>
</div>

<script>
const MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const WEEKDAYS_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

let currentRealDate = new Date();
let viewYear = currentRealDate.getFullYear();
let viewMonth = currentRealDate.getMonth();

function dateKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function todayKey(){ const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }
let selectedKey = todayKey(); 

let SCHEDULE = JSON.parse(localStorage.getItem('myUniversitySchedule')) || {};
let GEMINI_API_KEY = localStorage.getItem('geminiApiKey') || '';

function typeInfo(type) {
  const t = (type || "").toLowerCase();
  if (t.includes("lecture") || t.includes("лекц")) return { cls: "lec", icon: `<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>` };
  if (t.includes("phys") || t.includes("физ")) return { cls: "phys", icon: `<circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>` };
  return { cls: "sem", icon: `<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line>` };
}

function showToast(msg) {
  let toast = document.getElementById('appToast');
  if (!toast) { toast = document.createElement('div'); toast.id = 'appToast'; toast.className = 'toast'; document.body.appendChild(toast); }
  toast.textContent = msg;
  requestAnimationFrame(() => { toast.style.transform = 'translate(-50%, 20px)'; toast.style.opacity = '1'; });
  setTimeout(() => { toast.style.transform = 'translate(-50%, -100px)'; toast.style.opacity = '0'; }, 3500);
}
function showCustomAlert(msg) { document.getElementById('customAlertContainer').innerHTML = msg; document.getElementById('alertModal').classList.add('active'); }
let confirmCallback = null;
function showConfirm(msg, callback) { document.getElementById('confirmMessage').innerHTML = msg; confirmCallback = callback; document.getElementById('confirmModal').classList.add('active'); }
function closeConfirm() { document.getElementById('confirmModal').classList.remove('active'); confirmCallback = null; }
function executeConfirm() { if(confirmCallback) confirmCallback(); closeConfirm(); }

function openSettings() { document.getElementById('apiKeyInput').value = GEMINI_API_KEY; document.getElementById('settingsModal').classList.add('active'); }
function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }
function saveApiKey() { GEMINI_API_KEY = document.getElementById('apiKeyInput').value.trim(); localStorage.setItem('geminiApiKey', GEMINI_API_KEY); closeSettings(); showToast("Settings saved!"); }

function buildCalendar() {
  const grid = document.getElementById('calGrid');
  document.getElementById('calMonthLabel').textContent = `${MONTHS_EN[viewMonth]} ${viewYear}`;
  grid.innerHTML = '';

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const offset = (firstDay + 6) % 7; 
  const prevDays = new Date(viewYear, viewMonth, 0).getDate();

  for (let i = 0; i < offset; i++) {
    const el = document.createElement('div'); el.className = 'cal-cell other-month';
    el.innerHTML = `<span class="cal-num">${prevDays - offset + 1 + i}</span>`; grid.appendChild(el);
  }

  const tk = todayKey();
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(viewYear, viewMonth, d);
    const classes = SCHEDULE[key] || [];
    const isToday = key === tk;
    const isSel = key === selectedKey;

    const cell = document.createElement('div');
    cell.className = `cal-cell${isToday ? ' today' : ''}${isSel ? ' selected' : ''}`;

    const types = new Set();
    classes.forEach(c => types.add(typeInfo(c.type).cls));
    let dotsHtml = '';
    if (types.has('lec')) dotsHtml += `<div class="cal-dot dot-lec"></div>`;
    if (types.has('sem')) dotsHtml += `<div class="cal-dot dot-sem"></div>`;
    if (types.has('phys')) dotsHtml += `<div class="cal-dot dot-phys"></div>`;

    cell.innerHTML = `<span class="cal-num">${d}</span><div class="cal-dots">${dotsHtml}</div>`;
    cell.onclick = () => selectDay(key);
    grid.appendChild(cell);
  }

  const total = offset + daysInMonth; const rem = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= rem; d++) {
    const el = document.createElement('div'); el.className = 'cal-cell other-month';
    el.innerHTML = `<span class="cal-num">${d}</span>`; grid.appendChild(el);
  }
}

function changeMonth(dir) { viewMonth += dir; if (viewMonth > 11) { viewMonth = 0; viewYear++; } if (viewMonth < 0) { viewMonth = 11; viewYear--; } buildCalendar(); }
function goToToday() { const t = new Date(); viewYear = t.getFullYear(); viewMonth = t.getMonth(); selectDay(todayKey()); }

function selectDay(key) {
  selectedKey = key;
  buildCalendar(); 
  
  const container = document.getElementById('classesList');
  const classes = SCHEDULE[key] || [];
  const label = document.getElementById('classesDateLabel');
  
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  
  if (label) {
    if (key === todayKey()) label.textContent = `Today, ${d} ${MONTHS_EN[m-1]}`;
    else label.textContent = `${WEEKDAYS_FULL[dt.getDay()]}, ${d} ${MONTHS_EN[m-1]}`;
  }

  if (classes.length === 0) {
    const msg = (key === todayKey()) ? "Today is a holiday! Enjoy your day off." : "No classes scheduled.";
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🏖️</div>
        <div class="empty-title">All clear</div>
        <div style="font-size: 13px;">${msg}</div>
      </div>`;
    return;
  }

  let html = '';
  classes.sort((a,b) => (a.n||0) - (b.n||0)).forEach((c, i) => {
    const ti = typeInfo(c.type);
    // Escape string for JS call
    const safeName = c.name.replace(/'/g, "\\'"); 
    html += `
      <div class="class-card">
        <div class="class-time">
          <div class="time-start">${c.start}</div>
          <div class="time-end">${c.end}</div>
        </div>
        <div class="class-stripe stripe-${ti.cls}"></div>
        <div class="class-info">
          <div class="class-title">
            <svg style="width:14px; color:var(--${ti.cls})" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">${ti.icon}</svg>
            ${c.name}
          </div>
          <div class="class-meta">${c.type} • Rm ${c.room || "TBA"} • ${c.teacher || "TBA"}</div>
        </div>
        <div class="class-options" onclick="promptDeleteClass('${key}', ${i}, '${safeName}')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </div>
      </div>`;
  });
  container.innerHTML = html;
}

function promptDeleteClass(dateKey, index, name) {
  showConfirm(`Are you sure you want to remove <strong>${name}</strong>?`, () => {
    SCHEDULE[dateKey].splice(index, 1);
    if (SCHEDULE[dateKey].length === 0) delete SCHEDULE[dateKey];
    localStorage.setItem('myUniversitySchedule', JSON.stringify(SCHEDULE));
    showToast("Class deleted");
    selectDay(dateKey);
  });
}

function triggerImport() {
  if (!GEMINI_API_KEY) { showCustomAlert("Please set your Gemini API key in Settings first."); openSettings(); return; }
  document.getElementById('uploadInput').click();
}

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader(); reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = error => reject(error);
  });
}

async function handleFileUpload(event) {
  const files = event.target.files; if (!files || files.length === 0) return;
  document.getElementById('loadingOverlay').classList.add('active');

  try {
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`;
    const prompt = `
      Extract the university schedule from the provided image(s). Return a JSON array of lesson objects. 
      DO NOT translate subject names, types, or teacher names to English. Keep them in their ORIGINAL language.
      - 'date': MUST be strictly 'YYYY-MM-DD'.
      - 'n': integer lesson number (e.g. 1, 2).
      - 'start': start time (HH:MM).
      - 'end': end time (HH:MM).
      - 'name': Subject name (original language).
      - 'type': Type of lesson (original language).
      - 'room': Room number, or '-' if none.
      - 'teacher': Teacher name (original language). Remove ALL titles/degrees (like Ph.D., Professor, доцент, к.т.н). Just Name and Initials.
    `;
    const parts = [{ text: prompt }];
    for (const file of files) parts.push({ inlineData: { mimeType: file.type, data: await fileToBase64(file) } });

    const payload = {
      contents: [{ role: "user", parts: parts }],
      generationConfig: {
        maxOutputTokens: 8192, responseMimeType: "application/json",
        responseSchema: {
          type: "ARRAY", items: {
            type: "OBJECT", properties: {
              date: { type: "STRING" }, n: { type: "INTEGER" }, start: { type: "STRING" }, end: { type: "STRING" },
              name: { type: "STRING" }, type: { type: "STRING" }, room: { type: "STRING" }, teacher: { type: "STRING" }
            }, required: ["date", "n", "start", "end", "name", "type", "room", "teacher"]
          }
        }
      }
    };

    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error?.message || "API request failed");

    let textResponse = result.candidates[0].content.parts[0].text || "[]";
    textResponse = textResponse.replace(/```json/gi, '').replace(/```/g, '').trim();
    if (!textResponse.endsWith(']')) { textResponse = textResponse.replace(/,\s*$/, '') + ']'; }
    
    processImportedData(JSON.parse(textResponse));
  } catch (error) {
    showCustomAlert("Error analyzing image:<br>" + error.message);
  } finally {
    document.getElementById('loadingOverlay').classList.remove('active'); event.target.value = ''; 
  }
}

function normalizeDateStr(dStr) {
  if (!dStr) return null; let clean = dStr.replace(/[\.\/]/g, '-'); const parts = clean.split('-');
  if (parts.length === 3) {
    if (parts[0].length <= 2 && parts[2].length === 4) return `${parts[2]}-${String(Number(parts[1])).padStart(2, '0')}-${String(Number(parts[0])).padStart(2, '0')}`;
    if (parts[0].length === 4) return `${parts[0]}-${String(Number(parts[1])).padStart(2, '0')}-${String(Number(parts[2])).padStart(2, '0')}`;
  } return clean;
}
function normalizeTimeStr(tStr) {
   if (!tStr) return tStr; let parts = tStr.replace(/\./g, ':').trim().split(':');
   if (parts.length === 2) return `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
   return tStr;
}

function processImportedData(lessons) {
  let added = 0;
  lessons.forEach(l => {
    l.date = normalizeDateStr(l.date);
    l.start = normalizeTimeStr(l.start);
    l.end = normalizeTimeStr(l.end);
    
    if (l.date && l.date.includes('-')) {
      if (!SCHEDULE[l.date]) SCHEDULE[l.date] = [];
      if (!SCHEDULE[l.date].some(existing => existing.n === l.n && existing.name === l.name)) {
         SCHEDULE[l.date].push(l); added++;
      }
    }
  });
  
  Object.keys(SCHEDULE).forEach(date => SCHEDULE[date].sort((a,b) => (a.n||0) - (b.n||0)));
  localStorage.setItem('myUniversitySchedule', JSON.stringify(SCHEDULE));
  
  if (added > 0) {
    const firstDate = lessons[0].date;
    const [fy, fm] = firstDate.split('-').map(Number);
    viewYear = fy; viewMonth = fm - 1; 
    selectDay(firstDate);
    showToast(`Merged ${added} new classes!`);
  } else {
    showToast("No new classes found.");
  }
}

function exportToExcel() {
  if (Object.keys(SCHEDULE).length === 0) { showToast("Schedule is empty"); return; }
  let data = [];
  Object.keys(SCHEDULE).sort().forEach(date => {
    SCHEDULE[date].forEach(c => data.push({ Date: date, Period: c.n, Start: c.start, End: c.end, Subject: c.name, Type: c.type, Room: c.room, Teacher: c.teacher }));
  });
  const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Schedule");
  XLSX.writeFile(wb, "Schedule.xlsx");
}

function handleExcelImport(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result); const workbook = XLSX.read(data, {type: 'array'});
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
    let added = 0;
    rows.forEach(row => {
      if(!row.Date || !row.Subject) return;
      const date = normalizeDateStr(String(row.Date));
      if(!SCHEDULE[date]) SCHEDULE[date] = [];
      if(!SCHEDULE[date].some(c => c.n === row.Period && c.name === row.Subject)) {
         SCHEDULE[date].push({ n: row.Period || 1, start: row.Start || "09:10", end: row.End || "10:40", name: row.Subject, type: row.Type || "Seminar", room: row.Room || "-", teacher: row.Teacher || "-" });
         added++;
      }
    });
    Object.keys(SCHEDULE).forEach(d => SCHEDULE[d].sort((a,b) => (a.n||0) - (b.n||0)));
    localStorage.setItem('myUniversitySchedule', JSON.stringify(SCHEDULE));
    showToast(`Imported ${added} classes from Excel`);
    closeSettings(); selectDay(selectedKey);
  };
  reader.readAsArrayBuffer(file); event.target.value = '';
}

selectDay(selectedKey);
